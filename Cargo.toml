[workspace]
resolver = "2"
members = ["crates/flate", "crates/image", "crates/net", "crates/html", "crates/css", "crates/font", "crates/layout", "crates/paint", "crates/platform", "crates/shell"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Size budget: Broxee must stay under 60 MB.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
