<!doctype html><html><head><title>Effects</title><style>
body { margin: 16px; font: 14px/1.4 sans-serif; background: #fafafa }
.tile { display: inline-block; width: 150px; height: 100px; margin: 10px; vertical-align: top; color: #fff; padding: 6px; box-sizing: border-box }
.r { border-radius: 16px; background: #2f7d4f } .round { border-radius: 50%; background: #7d2f6a }
.shadow { background: #fff; color: #222; box-shadow: 0 4px 12px rgba(0,0,0,.35); border-radius: 8px }
.inset { background: #ddd; color: #222; box-shadow: inset 0 0 10px #555 }
.lin { background: linear-gradient(135deg, #f06, #48f) } .rad { background: radial-gradient(circle, #ffd54f, #e65100) }
.stops { background: linear-gradient(to right, red 0%, red 33%, white 33%, white 66%, blue 66%) }
.op { background: #000; opacity: .5 } .stack { position: relative; height: 140px }
.stack div { position: absolute; width: 90px; height: 90px; border: 2px solid #000 }
.a { background: #e53935; left: 0; top: 0; z-index: 3 } .b { background: #43a047; left: 40px; top: 25px; z-index: 1 } .c { background: #1e88e5; left: 80px; top: 50px; z-index: 2; opacity: .8 }
.rot { transform: rotate(12deg); background: #455a64 } .sk { transform: skewX(-15deg) scale(.9); background: #6d4c41 } .mv { transform: translate(20px, 10px); background: #00838f }
.clip { border-radius: 24px; overflow: hidden; padding: 0 } .clip div { height: 50px; background: #ff7043 }
.border { border: 6px solid #3949ab; border-radius: 12px 0 30px 4px; color: #222 }
</style></head><body>
<div class="tile r">radius</div><div class="tile round">ellipse</div><div class="tile shadow">shadow</div><div class="tile inset">inset shadow</div>
<div class="tile lin">linear</div><div class="tile rad">radial</div><div class="tile stops">hard stops</div><div class="tile op">opacity</div>
<div class="stack"><div class="a">z 3</div><div class="b">z 1</div><div class="c">z 2</div></div>
<div class="tile rot">rotate</div><div class="tile sk">skew scale</div><div class="tile mv">translate</div><div class="tile clip"><div></div>clipped child</div><div class="tile border">uneven radii</div>
</body></html>
