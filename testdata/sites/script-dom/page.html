<!doctype html><html><head><title>Script</title><style>
body { margin: 16px; font: 14px/1.4 sans-serif } .item { padding: 4px 8px; margin: 2px 0; background: #e3f2fd }
.item.odd { background: #fff3e0 } .done { text-decoration: line-through; color: #888 } #out { font-family: monospace; white-space: pre }
</style></head><body>
<h2 id="title">Built by script</h2><ul id="list"></ul><div id="out"></div><p id="later">waiting</p>
<script>
class Item { constructor(n) { this.n = n } get label() { return `Item ${this.n}` } }
const list = document.getElementById('list');
for (const n of [1, 2, 3, 4, 5, 6]) {
  const li = document.createElement('li');
  li.className = 'item' + (n % 2 ? ' odd' : '');
  li.textContent = new Item(n).label;
  if (n === 3) li.classList.add('done');
  list.appendChild(li);
}
function* fib() { let [a, b] = [0, 1]; for (;;) { yield a; [a, b] = [b, a + b] } }
const f = []; for (const x of fib()) { if (f.length >= 12) break; f.push(x) }
const words = 'the quick brown fox jumps over the lazy dog'.split(' ');
const counts = words.reduce((m, w) => (m[w] = (m[w] || 0) + 1, m), {});
document.getElementById('out').textContent =
  'fib: ' + f.join(',') + '\ncounts: ' + JSON.stringify(counts) +
  '\nregex: ' + 'a1b22c333'.replace(/\d+/g, m => `[${m.length}]`) +
  '\ndate: ' + new Date().toISOString().slice(0, 10) + '\nrandom: ' + Math.random().toFixed(6);
document.getElementById('title').style.color = '#2e7d32';
(async () => { await null; document.getElementById('later').textContent = 'set after await' })();
</script></body></html>
