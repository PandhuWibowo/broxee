<!doctype html><html><head><title>Flex</title><style>
body { margin: 16px; font: 14px/1.4 sans-serif }
.row { display: flex; gap: 8px; margin-bottom: 12px; padding: 6px; background: #eef }
.row > div { background: #4a7bd0; color: #fff; padding: 8px }
.wrap { flex-wrap: wrap; width: 500px } .wrap > div { width: 140px }
.between { justify-content: space-between } .center { justify-content: center; align-items: center; height: 80px }
.grow > :nth-child(2) { flex: 1 } .grow > :nth-child(3) { flex: 2 }
.col { flex-direction: column; width: 200px } .end { align-items: flex-end }
.shrink > div { flex: 0 1 300px } .rev { flex-direction: row-reverse }
.stretch { height: 90px } .stretch > div:first-child { font-size: 24px }
.nav { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid #ccc; padding: 4px 0 }
.nav .spacer { margin-left: auto }
</style></head><body>
<h2>Flex containers</h2>
<div class="row"><div>one</div><div>two words</div><div>three</div></div>
<div class="row between"><div>left</div><div>middle</div><div>right</div></div>
<div class="row center"><div>centered</div><div style="padding:20px">tall</div></div>
<div class="row grow"><div>fixed</div><div>flex 1</div><div>flex 2</div></div>
<div class="row wrap"><div>a</div><div>b</div><div>c</div><div>d</div><div>e</div><div>f</div><div>g</div></div>
<div class="row col end"><div>column</div><div>aligned to the end</div><div>end</div></div>
<div class="row shrink" style="width:600px"><div>shrinks</div><div>shrinks too, with longer content inside</div><div>and this</div></div>
<div class="row rev"><div>1</div><div>2</div><div>3</div></div>
<div class="row stretch"><div>big</div><div>stretched</div><div style="align-self:center">self center</div></div>
<nav class="nav"><b style="font-size:22px">Brand</b><a href="#">Home</a><a href="#">Docs</a><span class="spacer"></span><a href="#">Sign in</a></nav>
</body></html>
